<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>레아쥬 갤러리 상세 | REAGE</title>

  <meta name="description" content="레아쥬 갤러리 상세 페이지입니다." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://www.reage.co.kr/gallery.html" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:site_name" content="REAGE" />
  <meta property="og:title" content="레아쥬 갤러리 상세 | REAGE" />
  <meta property="og:description" content="레아쥬 갤러리 상세 페이지입니다." />
  <meta property="og:url" content="https://www.reage.co.kr/gallery.html" />
  <meta property="og:image" content="https://www.reage.co.kr/mainimage.png" />
  <meta property="og:image:alt" content="레아쥬 갤러리 상세 | REAGE" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="레아쥬 갤러리 상세 | REAGE" />
  <meta name="twitter:description" content="레아쥬 갤러리 상세 페이지입니다." />
  <meta name="twitter:image" content="https://www.reage.co.kr/mainimage.png" />
  <meta name="theme-color" content="#6B0F1A" />
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "레아쥬 갤러리 상세 | REAGE",
    "description": "레아쥬 갤러리 상세 페이지입니다.",
    "url": "https://www.reage.co.kr/gallery.html",
    "inLanguage": "ko-KR",
    "isPartOf": {
      "@type": "WebSite",
      "name": "REAGE",
      "url": "https://www.reage.co.kr/"
    }
  }
  </script>
  <!-- SEO:END -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --wine: #6B0F1A;
      --gold: #C8A26A;
      --charcoal: #1A1412;
      --offwhite: #F7F5F2;
      --light-gray: #EEEBE6;
      --text: #2C2420;
      --muted: #8A7F78;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--offwhite); color: var(--text); }
    a { text-decoration: none; color: inherit; }

    /* Header */
    #header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid var(--light-gray); }
    #header .inner { max-width: 1160px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .logo { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 700; color: var(--charcoal); letter-spacing: .08em; }
    .logo span { color: var(--wine); }

    /* Breadcrumb */
    .breadcrumb { background: var(--charcoal); padding: 12px 0; }
    .breadcrumb .inner { max-width: 1160px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(247,245,242,.5); }
    .breadcrumb a { color: rgba(247,245,242,.5); transition: color .2s; }
    .breadcrumb a:hover { color: var(--gold); }
    .breadcrumb .sep { opacity: .4; }
    .breadcrumb .current { color: var(--gold); }

    /* Detail */
    .detail-wrap { max-width: 900px; margin: 60px auto; padding: 0 32px 80px; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-bottom: 32px; cursor: pointer; transition: color .2s; border: none; background: none; }
    .back-btn:hover { color: var(--wine); }
    .detail-tag { font-size: 11px; font-weight: 700; letter-spacing: .15em; color: var(--gold); margin-bottom: 12px; text-transform: uppercase; }
    .detail-title { font-family: 'Noto Serif KR', serif; font-size: 32px; font-weight: 700; color: var(--charcoal); line-height: 1.4; margin-bottom: 16px; }
    .detail-date { font-size: 13px; color: var(--muted); margin-bottom: 40px; }
    .detail-content { font-size: 16px; line-height: 1.9; color: var(--text); margin-bottom: 40px; }
    /* 리치 에디터 HTML 콘텐츠 스타일 */
    .detail-content h1, .detail-content h2, .detail-content h3 { font-family: 'Noto Serif KR', serif; font-weight: 700; color: var(--charcoal); margin: 1.5em 0 0.5em; line-height: 1.4; }
    .detail-content h1 { font-size: 28px; }
    .detail-content h2 { font-size: 22px; }
    .detail-content h3 { font-size: 18px; }
    .detail-content p { margin: 0.8em 0; }
    .detail-content ul, .detail-content ol { padding-left: 1.5em; margin: 0.8em 0; }
    .detail-content li { margin: 0.3em 0; }
    .detail-content strong { font-weight: 700; }
    .detail-content em { font-style: italic; }
    .detail-content u { text-decoration: underline; }
    .detail-content s { text-decoration: line-through; }
    .detail-content blockquote { border-left: 4px solid var(--gold); padding: 12px 20px; margin: 1.2em 0; background: rgba(200,162,106,0.08); color: var(--muted); font-style: italic; border-radius: 0 8px 8px 0; }
    .detail-content img { max-width: 100%; border-radius: 10px; margin: 1em 0; display: block; }
    .detail-content a { color: var(--wine); text-decoration: underline; }
    .detail-content hr { border: none; border-top: 1px solid var(--light-gray); margin: 2em 0; }
    .detail-content pre { background: #f4f4f4; border-radius: 6px; padding: 12px 16px; overflow-x: auto; font-size: 14px; margin: 1em 0; }
    .detail-content code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
    .detail-content table { width: 100%; border-collapse: collapse; margin: 1em 0; }
    .detail-content th, .detail-content td { border: 1px solid var(--light-gray); padding: 8px 12px; text-align: left; }
    .detail-content th { background: var(--light-gray); font-weight: 600; }
    .detail-content [style*="text-align: center"], .detail-content .ProseMirror-center { text-align: center; }
    .detail-content [style*="text-align: right"], .detail-content .ProseMirror-right { text-align: right; }
    .divider { border: none; border-top: 1px solid var(--light-gray); margin: 48px 0; }

    /* ─── 이미지 슬라이더 ─── */
    .slider-section { margin-bottom: 40px; }
    .slider-wrap { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: var(--light-gray); user-select: none; }
    .slider-track { display: flex; transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform; }
    .slide { flex: 0 0 100%; width: 100%; }
    .slide img { width: 100%; max-height: 600px; object-fit: contain; display: block; background: #000; }

    /* 슬라이더 버튼 */
    .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(26,20,18,.55); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: background .2s; z-index: 10; }
    .slider-btn:hover { background: rgba(107,15,26,.85); }
    .slider-btn.prev { left: 12px; }
    .slider-btn.next { right: 12px; }
    .slider-btn:disabled { opacity: 0.3; cursor: default; }

    /* 슬라이더 인디케이터 */
    .slider-dots { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
    .slider-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--light-gray); border: none; cursor: pointer; transition: background .2s, transform .2s; padding: 0; }
    .slider-dot.active { background: var(--wine); transform: scale(1.3); }

    /* 슬라이더 카운터 */
    .slider-counter { position: absolute; bottom: 12px; right: 16px; background: rgba(0,0,0,.5); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 20px; z-index: 10; }

    /* 단일 이미지 (슬라이더 없음) */
    .single-cover { width: 100%; border-radius: 16px; overflow: hidden; background: var(--light-gray); }
    .single-cover img { width: 100%; max-height: 600px; object-fit: contain; display: block; }

    /* Nav between posts */
    .post-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 48px; }
    .post-nav-btn { flex: 1; padding: 16px 20px; border: 1px solid var(--light-gray); border-radius: 10px; background: #fff; cursor: pointer; transition: border-color .2s, background .2s; text-align: left; }
    .post-nav-btn:hover { border-color: var(--wine); background: var(--offwhite); }
    .post-nav-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .post-nav-title { font-size: 14px; font-weight: 600; color: var(--charcoal); }

    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; min-height: 300px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--light-gray); border-top-color: var(--wine); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .detail-title { font-size: 24px; }
      .detail-wrap { padding: 0 16px 60px; margin-top: 40px; }
      .slider-btn { width: 36px; height: 36px; font-size: 14px; }
    }
  </style>
</head>
<body>

<header id="header">
  <div class="inner">
    <a href="/" class="logo">RE<span>AGE</span></a>
    <div id="header-auth-area"></div>
  </div>
</header>

<div class="breadcrumb">
  <div class="inner">
    <a href="/">홈</a>
    <span class="sep">›</span>
    <a href="/gallery.html">갤러리</a>
    <span class="sep">›</span>
    <span class="current" id="breadcrumb-title">상세보기</span>
  </div>
</div>

<div class="detail-wrap">
  <button class="back-btn" onclick="history.back()">← 갤러리 목록으로</button>
  <div id="detail-content">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<script src="/header-auth.js"></script>
<script src="/header-products.js"></script>
<script>
// ─── 슬라이더 상태 ───────────────────────────────────────────────
let sliderImages = [];
let currentSlide = 0;

function initSlider(images) {
  sliderImages = images;
  currentSlide = 0;
  renderSlider();
}

function renderSlider() {
  const wrap = document.getElementById('slider-wrap');
  const track = document.getElementById('slider-track');
  const dots = document.getElementById('slider-dots');
  const counter = document.getElementById('slider-counter');
  if (!wrap || !track) return;

  track.style.transform = `translateX(-${currentSlide * 100}%)`;
  counter.textContent = `${currentSlide + 1} / ${sliderImages.length}`;

  // 버튼 상태
  document.getElementById('slider-prev').disabled = currentSlide === 0;
  document.getElementById('slider-next').disabled = currentSlide === sliderImages.length - 1;

  // 도트 업데이트
  dots.querySelectorAll('.slider-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentSlide);
  });
}

function slideTo(index) {
  currentSlide = Math.max(0, Math.min(index, sliderImages.length - 1));
  renderSlider();
}

function slidePrev() { slideTo(currentSlide - 1); }
function slideNext() { slideTo(currentSlide + 1); }

// 터치/스와이프 지원
let touchStartX = 0;
function onTouchStart(e) { touchStartX = e.touches[0].clientX; }
function onTouchEnd(e) {
  const diff = touchStartX - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 50) { diff > 0 ? slideNext() : slidePrev(); }
}

// 키보드 지원
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') slidePrev();
  if (e.key === 'ArrowRight') slideNext();
});

// ─── 데이터 로드 ───────────────────────────────────────────────
async function loadPost() {
  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get('id'));
  if (!id) { renderError('게시물 ID가 없습니다.'); return; }

  try {
    const input = encodeURIComponent(JSON.stringify({ "0": { json: { id } } }));
    const res = await fetch(`/api/trpc/gallery.byId?batch=1&input=${input}`, { credentials: 'include' });
    if (!res.ok) throw new Error('Not found');
    const data = await res.json();
    const post = data[0]?.result?.data?.json;
    if (!post) throw new Error('Post not found');
    renderPost(post);
  } catch(e) {
    renderError('게시물을 불러올 수 없습니다.');
  }
}

function renderPost(post) {
  const dateStr = post.createdAt
    ? new Date(post.createdAt).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
    : '';
  document.title = `${post.title} — REAGE 갤러리`;
  document.getElementById('breadcrumb-title').textContent = post.title;

  // 이미지 목록 구성: 커버 이미지 + 추가 이미지들
  const allImages = [];
  if (post.coverImageUrl) allImages.push({ url: post.coverImageUrl, alt: post.title });
  if (post.images && post.images.length > 0) {
    post.images.forEach(img => {
      // 커버와 중복 방지
      if (img.imageUrl !== post.coverImageUrl) {
        allImages.push({ url: img.imageUrl, alt: img.caption || post.title });
      }
    });
  }

  // 이미지 섹션 HTML 생성
  let imageHtml = '';
  if (allImages.length === 0) {
    imageHtml = `<div class="single-cover" style="min-height:300px;display:flex;align-items:center;justify-content:center;font-size:64px;">📸</div>`;
  } else if (allImages.length === 1) {
    // 단일 이미지 - 슬라이더 없음
    imageHtml = `
      <div class="single-cover">
        <img src="${allImages[0].url}" alt="${escapeHtml(allImages[0].alt)}" />
      </div>
    `;
  } else {
    // 다중 이미지 - 슬라이더
    const slides = allImages.map((img, i) => `
      <div class="slide">
        <img src="${img.url}" alt="${escapeHtml(img.alt)}" loading="${i === 0 ? 'eager' : 'lazy'}" />
      </div>
    `).join('');

    const dots = allImages.map((_, i) => `
      <button class="slider-dot${i === 0 ? ' active' : ''}" onclick="slideTo(${i})" aria-label="슬라이드 ${i + 1}"></button>
    `).join('');

    imageHtml = `
      <div class="slider-section">
        <div class="slider-wrap" id="slider-wrap" ontouchstart="onTouchStart(event)" ontouchend="onTouchEnd(event)">
          <div class="slider-track" id="slider-track">${slides}</div>
          <button class="slider-btn prev" id="slider-prev" onclick="slidePrev()" aria-label="이전">&#8249;</button>
          <button class="slider-btn next" id="slider-next" onclick="slideNext()" aria-label="다음">&#8250;</button>
          <div class="slider-counter" id="slider-counter">1 / ${allImages.length}</div>
        </div>
        <div class="slider-dots" id="slider-dots">${dots}</div>
      </div>
    `;
  }

  // 리치 에디터 HTML 콘텐츠인지 일반 텍스트인지 판별
  const isHtmlContent = post.content && (post.content.trim().startsWith('<') || post.content.includes('<p>') || post.content.includes('<h'));
  const contentHtml = post.content
    ? `<div class="detail-content">${isHtmlContent ? post.content : escapeHtml(post.content).replace(/\n/g, '<br>')}</div>`
    : '';

  document.getElementById('detail-content').innerHTML = `
    <div class="detail-tag">GALLERY</div>
    <h1 class="detail-title">${escapeHtml(post.title)}</h1>
    <div class="detail-date">${dateStr}</div>
    ${imageHtml}
    ${contentHtml}
    <hr class="divider" />
    <div class="post-nav">
      <button class="post-nav-btn" onclick="history.back()">
        <div class="post-nav-label">← 이전으로</div>
        <div class="post-nav-title">갤러리 목록</div>
      </button>
    </div>
  `;

  // 다중 이미지인 경우 슬라이더 초기화
  if (allImages.length > 1) {
    initSlider(allImages);
  }
}

function renderError(msg) {
  document.getElementById('detail-content').innerHTML = `<p style="color:var(--muted);text-align:center;padding:60px 0;">${msg}</p>`;
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadPost();
</script>
<script src="i18n/core.js"></script>
</body>
</html>
