<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>매거진 상세 — REAGE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --wine: #6B0F1A;
      --gold: #C8A26A;
      --charcoal: #1A1412;
      --offwhite: #F7F5F2;
      --light-gray: #EEEBE6;
      --text: #2C2420;
      --muted: #8A7F78;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--offwhite); color: var(--text); }
    a { text-decoration: none; color: inherit; }

    /* Header */
    #header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 1px solid var(--light-gray); }
    #header .inner { max-width: 1160px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .logo { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 700; color: var(--charcoal); letter-spacing: .08em; }
    .logo span { color: var(--wine); }

    /* Breadcrumb */
    .breadcrumb { background: var(--charcoal); padding: 12px 0; }
    .breadcrumb .inner { max-width: 1160px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(247,245,242,.5); }
    .breadcrumb a { color: rgba(247,245,242,.5); transition: color .2s; }
    .breadcrumb a:hover { color: var(--gold); }
    .breadcrumb .sep { opacity: .4; }
    .breadcrumb .current { color: var(--gold); }

    /* Hero */
    .article-hero { background: var(--charcoal); padding: 80px 0 60px; position: relative; overflow: hidden; }
    .article-hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(107,15,26,.4) 0%, transparent 70%); }
    .article-hero .inner { max-width: 900px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 1; }
    .article-hero-tag { font-size: 11px; font-weight: 700; letter-spacing: .2em; color: var(--gold); margin-bottom: 20px; text-transform: uppercase; }
    .article-hero-title { font-family: 'Noto Serif KR', serif; font-size: 38px; font-weight: 700; color: #fff; line-height: 1.4; margin-bottom: 16px; }
    .article-hero-subtitle { font-size: 18px; color: rgba(247,245,242,.7); line-height: 1.6; margin-bottom: 24px; }
    .article-hero-meta { font-size: 13px; color: rgba(247,245,242,.5); }

    /* Cover image */
    .article-cover { max-width: 900px; margin: 0 auto; padding: 0 32px; margin-top: -40px; position: relative; z-index: 2; }
    .article-cover img { width: 100%; border-radius: 16px; box-shadow: 0 24px 60px rgba(26,20,18,.3); display: block; }
    .article-cover-placeholder { width: 100%; border-radius: 16px; background: var(--charcoal); min-height: 400px; display: flex; align-items: center; justify-content: center; font-size: 80px; box-shadow: 0 24px 60px rgba(26,20,18,.3); }

    /* Body */
    .article-body { max-width: 900px; margin: 60px auto; padding: 0 32px 80px; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; margin-bottom: 40px; cursor: pointer; transition: color .2s; border: none; background: none; }
    .back-btn:hover { color: var(--wine); }
    .article-content { font-size: 17px; line-height: 2; color: var(--text); white-space: pre-wrap; }
    .article-content p { margin-bottom: 1.5em; }
    .divider { border: none; border-top: 1px solid var(--light-gray); margin: 48px 0; }

    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; min-height: 300px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--light-gray); border-top-color: var(--wine); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .article-hero-title { font-size: 26px; }
      .article-hero { padding: 60px 0 40px; }
      .article-body { padding: 0 16px 60px; margin-top: 40px; }
      .article-cover { padding: 0 16px; }
    }
  </style>
</head>
<body>

<header id="header">
  <div class="inner">
    <a href="/index-main.html" class="logo">RE<span>AGE</span></a>
    <div id="header-auth-area"></div>
  </div>
</header>

<div class="breadcrumb">
  <div class="inner">
    <a href="/index-main.html">홈</a>
    <span class="sep">›</span>
    <a href="/magazine.html">매거진</a>
    <span class="sep">›</span>
    <span class="current" id="breadcrumb-title">상세보기</span>
  </div>
</div>

<div id="hero-section"></div>
<div id="cover-section"></div>

<div class="article-body">
  <button class="back-btn" onclick="history.back()">← 매거진 목록으로</button>
  <div id="body-content">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>

<script src="/header-auth.js"></script>
<script src="/header-products.js"></script>
<script>
async function loadPost() {
  const params = new URLSearchParams(location.search);
  const id = parseInt(params.get('id'));
  if (!id) { renderError('게시물 ID가 없습니다.'); return; }

  try {
    const input = encodeURIComponent(JSON.stringify({ "0": { json: { id } } }));
    const res = await fetch(`/api/trpc/magazine.byId?batch=1&input=${input}`, { credentials: 'include' });
    if (!res.ok) throw new Error('Not found');
    const data = await res.json();
    const post = data[0]?.result?.data?.json;
    if (!post) throw new Error('Post not found');
    renderPost(post);
  } catch(e) {
    renderError('게시물을 불러올 수 없습니다.');
  }
}

function renderPost(post) {
  const dateStr = post.createdAt
    ? new Date(post.createdAt).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' })
    : '';

  document.title = `${post.title} — REAGE 매거진`;
  document.getElementById('breadcrumb-title').textContent = post.title;

  // Hero
  document.getElementById('hero-section').innerHTML = `
    <div class="article-hero">
      <div class="inner">
        <div class="article-hero-tag">MAGAZINE</div>
        <h1 class="article-hero-title">${escapeHtml(post.title)}</h1>
        ${post.subtitle ? `<p class="article-hero-subtitle">${escapeHtml(post.subtitle)}</p>` : ''}
        <div class="article-hero-meta">${dateStr}</div>
      </div>
    </div>`;

  // Cover image
  if (post.coverImageUrl) {
    document.getElementById('cover-section').innerHTML = `
      <div class="article-cover">
        <img src="${post.coverImageUrl}" alt="${escapeHtml(post.title)}" />
      </div>`;
  } else {
    document.getElementById('cover-section').innerHTML = `
      <div class="article-cover">
        <div class="article-cover-placeholder">📝</div>
      </div>`;
  }

  // Body content
  const contentHtml = post.content
    ? `<div class="article-content">${escapeHtml(post.content)}</div>`
    : '<p style="color:var(--muted);">본문 내용이 없습니다.</p>';

  document.getElementById('body-content').innerHTML = `
    ${contentHtml}
    <hr class="divider" />
    <div style="text-align:center;">
      <a href="/magazine.html" style="display:inline-flex;align-items:center;gap:8px;background:var(--wine);color:#fff;padding:12px 28px;border-radius:8px;font-size:14px;font-weight:600;">← 매거진 목록으로</a>
    </div>`;
}

function renderError(msg) {
  document.getElementById('body-content').innerHTML = `<p style="color:var(--muted);text-align:center;padding:60px 0;">${msg}</p>`;
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadPost();
</script>
</body>
</html>
